[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telescope-rag"
version = "0.1.0"
description = "Public website information chatbot for Telescope Medical Center"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "fastapi>=0.115,<1",
    "httpcore2>=2,<3",
    "httpx2>=2,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "tokenizers==0.22.2",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telescope_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
