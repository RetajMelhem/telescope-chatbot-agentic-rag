# M3 PC-only access. Qdrant remains on its existing internal Docker network.
# No secrets, access logs, caching or automatic upstream retries.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 8m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 6333;
        server_name _;

        location / {
            set $qdrant_backend telescope-m3-qdrant:6333;
            proxy_pass http://$qdrant_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_request_buffering on;
            proxy_buffering off;
        }
    }
}
